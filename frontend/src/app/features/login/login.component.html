<div class="login-pagina">
  <app-financial-background />
  <div class="login-tarjeta">
    <div class="login-marca">
      <img
          src="/logo.svg"
          alt="Logo Control de Gastos"
          class="logo"
      />

      <div>
        <h1>Control de Gastos</h1>
        <p>Ingrese con su cuenta para continuar</p>
      </div>
    </div>

    <div class="mensaje-expiracion" *ngIf="mensajeExpiracion">
      <span class="mensaje-expiracion__icono">⏰</span>
      <span class="mensaje-expiracion__texto">{{ mensajeExpiracion }}</span>
      <button
        type="button"
        class="mensaje-expiracion__btn"
        (click)="aceptarMensajeExpiracion()"
      >
        Aceptar
      </button>
    </div>

    <!-- Mensaje de cuenta creada (llega desde /registro vía router state) -->
    <div class="mensaje-registro" *ngIf="mensajeRegistro">
      <span class="mensaje-registro__icono">✓</span>
      <span class="mensaje-registro__texto">{{ mensajeRegistro }}</span>
      <button
        type="button"
        class="mensaje-registro__btn"
        (click)="aceptarMensajeRegistro()"
      >
        Aceptar
      </button>
    </div>

    <!-- Confirmación de cierre de sesión (llega desde el sidebar) -->
    <div class="mensaje-registro" *ngIf="mensajeLogout">
      <span class="mensaje-registro__icono">✓</span>
      <span class="mensaje-registro__texto">{{ mensajeLogout }}</span>
      <button
        type="button"
        class="mensaje-registro__btn"
        (click)="aceptarMensajeLogout()"
      >
        Aceptar
      </button>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="login-form">
      <div class="campo">
        <label for="correo">Correo</label>
        <input
          id="correo"
          type="email"
          formControlName="correo"
          placeholder="sucorreo@ejemplo.com"
          autocomplete="username"
        />
        <small class="error" *ngIf="correo.invalid && correo.touched">
          Ingrese un correo válido
        </small>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <small class="error" *ngIf="password.invalid && password.touched">
          La contraseña es obligatoria
        </small>
      </div>

      <small class="error error--general" *ngIf="errorMensaje">{{ errorMensaje }}</small>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? "Ingresando..." : "Ingresar" }}
      </button>

      <div class="login-registro">
        <p>¿No tiene cuenta? <a routerLink="/registro">Regístrese aquí</a></p>
      </div>
    </form>

    <!-- Login con Google (se oculta si no hay googleClientId configurado) -->
    <div class="login-google" *ngIf="googleConfigurado">
      <div class="login-divisor">
        <span>o continúe con</span>
      </div>
      <div id="boton-google" class="boton-google"></div>
      <small class="error error--general" *ngIf="cargandoGoogle">
        Verificando con Google…
      </small>
    </div>
  </div>
</div>
